<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,100..900;1,50..150,100..900&family=Libre+Franklin:ital,wght@0,400..800;1,400..800&display=swap">
<style id="base">
html,body{margin:0;overflow:hidden}
#lienzo{position:relative;width:1200px;height:630px;overflow:hidden;background:linear-gradient(90deg, rgba(23,25,30,.96) 0%, rgba(23,25,30,.86) 38%, rgba(23,25,30,.25) 64%, rgba(23,25,30,0) 80%), url("estadio.webp") 62% 40% / cover #17191E;font-family:"Libre Franklin",Arial,sans-serif;color:#F5F6F1}
.o-marca{position:absolute;left:70px;top:92px;margin:0;font-family:Anybody,sans-serif;font-style:italic;font-weight:900;font-stretch:140%;font-size:62px;line-height:.92;text-transform:uppercase;color:#F7E08A;letter-spacing:-.01em}
.o-tintas{position:absolute;left:74px;top:262px;display:flex;gap:6px;width:300px;height:10px;transform:skewX(-16deg)}
.o-tintas i{flex:1}
.o-sub{position:absolute;left:70px;top:300px;margin:0;width:520px;font-family:Anybody,sans-serif;font-weight:850;font-stretch:86%;font-size:36px;line-height:1.08;color:#F5F6F1}
.o-cta{position:absolute;left:70px;top:430px;display:flex;align-items:center;gap:14px;padding:16px 26px 16px 16px;border-radius:18px;background:linear-gradient(120deg,#B8892B,#F7E08A 35%,#FFF6D0 50%,#E2BC52 72%,#B8892B);color:#17191E;font-family:Anybody,sans-serif;font-style:italic;font-weight:900;font-stretch:118%;font-size:30px;text-transform:uppercase;box-shadow:inset 0 0 0 3px #7A5A12}
.o-cta span{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#17191E;color:#F7E08A;font-style:normal;font-size:30px}
.o-url{position:absolute;left:72px;bottom:34px;margin:0;font-size:20px;color:#D9DCD2;letter-spacing:.02em}
.o-copa{position:absolute;z-index:3;left:604px;bottom:22px;height:300px;filter:drop-shadow(0 18px 22px rgba(0,0,0,.6))}
.o-cartas{position:absolute;right:24px;top:70px;display:flex;align-items:flex-end;--fw:210px}
.o-cartas .hueco{width:210px}
.o-cartas .hueco + .hueco{margin-left:-70px}
.o-cartas .hueco:nth-child(1){rotate:-10deg;translate:0 36px}
.o-cartas .hueco:nth-child(2){z-index:2;translate:0 -6px}
.o-cartas .hueco:nth-child(3){rotate:9deg;translate:0 40px}
iframe{position:absolute;left:-3000px;top:0;width:1280px;height:1000px;border:0}
</style></head>
<body>
<div id="lienzo">
  <p class="o-marca">La Chiqui<br>League</p>
  <div class="o-tintas"><i style="background:#D5352A"></i><i style="background:#0B7F4D"></i><i style="background:#2257C5"></i><i style="background:#F4B617"></i></div>
  <p class="o-sub">La Liga Profesional en figuritas, y un juego para armar tu once.</p>
  <div class="o-cta"><span>★</span>Jugá la Copa Chiqui</div>
  <p class="o-url">lachiquileague.pages.dev</p>
  <div class="o-cartas" id="cartas"></div>
  <img class="o-copa" src="copa.webp" alt="">
</div>
<iframe id="f" src="file:///C:/Users/frabu/futbol%20franco/index.html"></iframe>
<script>
const espera = (ms) => new Promise((r) => setTimeout(r, ms));
document.getElementById('f').onload = async () => {
  await espera(1200);
  const d = document.getElementById('f').contentDocument;
  // Los estilos de la página, para que las figuritas se vean igual que en el sitio
  d.querySelectorAll('style').forEach((s) => { const c = document.createElement('style'); c.textContent = s.textContent; document.head.insertBefore(c, document.getElementById('base')); });
  const liga = [...d.querySelectorAll('.modo-card:not(.modo-card--retro) .hueco')];
  const retro = [...d.querySelectorAll('.modo-card--retro .hueco')];
  const elegidas = [liga[0], retro[1], retro[2]].filter(Boolean);
  const caja = document.getElementById('cartas');
  elegidas.forEach((h) => caja.appendChild(h.cloneNode(true)));
};
</script>
</body></html>
